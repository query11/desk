name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DeskTap.dll
        shell: pwsh
        run: |
          cmake -S src/DeskTap -B build/DeskTap -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/DeskTap --config Release 2>&1 | Tee-Object -FilePath build/desktap-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Set up .NET
        if: hashFiles('src/Desk/Desk.csproj') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Desk.exe
        if: hashFiles('src/Desk/Desk.csproj') != ''
        shell: pwsh
        run: |
          # Not compressed and with WPF's native DLLs next to Desk.exe: nothing
          # has to be unpacked when Desk starts at sign-in.
          dotnet publish src/Desk/Desk.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -o dist/Desk 2>&1 | Tee-Object -FilePath build/desk-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Desk | Out-Null
          Copy-Item build/DeskTap/Release/DeskTap.dll dist/Desk/
          if (Test-Path themes) { Copy-Item -Recurse -Force themes dist/Desk/themes }
          Copy-Item LICENSE dist/Desk/LICENSE.txt
          Get-ChildItem dist/Desk -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Desk-${{ github.sha }}
          path: dist/Desk
          if-no-files-found: error

      # Last step, so that the warnings end up at the tail of the log.
      - name: Warnings summary
        if: always()
        shell: pwsh
        run: |
          foreach ($log in Get-ChildItem build -Filter *-build.log -ErrorAction SilentlyContinue) {
            $lines = Select-String -Path $log.FullName -Pattern 'warning|error' |
              ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 80
            Write-Output "===== $($log.Name): $($lines.Count) lines with warnings/errors"
            $lines | ForEach-Object { Write-Output $_ }
          }
